<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kotote（コトテ）— 離れて暮らす家族を、技術で見守る</title>
  <meta name="description" content="Kotote（コトテ）は、家族の安心をテクノロジーで支えるアプリを開発しています。" />
  <style>
    :root {
      --brand:       #1a4fd6;
      --brand-light: #3b6ef0;
      --brand-pale:  #eff4ff;
      --accent:      #059669;
      --text:        #1a1d23;
      --muted:       #6b7280;
      --border:      #e2e5eb;
      --bg:          #ffffff;
      --bg2:         #f7f8fa;
      --radius-md:   14px;
      --radius-lg:   20px;
      --shadow-sm:   0 2px 8px rgba(0,0,0,0.06);
      --shadow-md:   0 4px 20px rgba(0,0,0,0.09);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); }

    /* Nav */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav__brand {
      font-size: 1.1rem; font-weight: 800;
      color: var(--brand); letter-spacing: 1px;
      text-decoration: none;
    }
    .nav__links { display: flex; gap: 24px; }
    .nav__links a { font-size: 0.85rem; color: var(--muted); text-decoration: none; }
    .nav__links a:hover { color: var(--brand); }

    /* Hero */
    .hero {
      background: var(--brand-pale);
      padding: 80px 24px 72px;
      text-align: center;
    }
    .hero__label {
      display: inline-block;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 2px;
      color: var(--brand); text-transform: uppercase;
      background: rgba(26,79,214,0.08);
      border: 1px solid rgba(26,79,214,0.18);
      border-radius: 20px; padding: 4px 14px;
      margin-bottom: 24px;
    }
    .hero__title {
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      font-weight: 800; line-height: 1.35;
      color: var(--text); margin-bottom: 16px;
    }
    .hero__title em { font-style: normal; color: var(--brand); }
    .hero__desc {
      font-size: 1rem; color: var(--muted);
      line-height: 1.8; max-width: 480px; margin: 0 auto;
    }

    /* Apps section */
    .apps {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    .section-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 2px;
      color: var(--brand); text-transform: uppercase;
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 1.4rem; font-weight: 800;
      color: var(--text); margin-bottom: 32px;
    }

    .app-card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .app-card:hover {
      border-color: var(--brand);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .app-icon {
      width: 72px; height: 72px;
      border-radius: var(--radius-md);
      background: var(--brand-pale);
      border: 1px solid rgba(26,79,214,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .app-icon img { width: 72px; height: 72px; display: block; }
    .app-info h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .app-info p { color: var(--muted); font-size: 0.88rem; line-height: 1.65; }
    .app-badges { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.7rem; font-weight: 600;
    }
    .badge--platform {
      background: rgba(26,79,214,0.08);
      color: var(--brand);
      border: 1px solid rgba(26,79,214,0.2);
    }
    .badge--status {
      background: rgba(5,150,105,0.08);
      color: var(--accent);
      border: 1px solid rgba(5,150,105,0.22);
    }

    /* Coming soon placeholder */
    .app-card--soon {
      border-style: dashed;
      opacity: 0.55;
      pointer-events: none;
    }
    .app-card--soon .app-icon { background: var(--bg2); border-color: var(--border); }

    /* Footer */
    footer {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 40px 24px;
    }
    .footer__links { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; }
    .footer__links a { font-size: 0.82rem; color: var(--muted); text-decoration: none; }
    .footer__links a:hover { color: var(--brand); }
    .footer__copy { font-size: 0.78rem; color: #aaa; }

    /* === Animations === */
    .hero__label { animation: hero-in 0.7s cubic-bezier(0.22,1,0.36,1) both; }
    .hero__title  { animation: hero-in 0.7s cubic-bezier(0.22,1,0.36,1) 0.08s both; }
    .hero__desc   { animation: hero-in 0.7s cubic-bezier(0.22,1,0.36,1) 0.16s both; }
    @keyframes hero-in { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }

    .anim-up { opacity: 0; }
    .anim-up.in { animation: anim-fade-up 0.6s cubic-bezier(0.22,1,0.36,1) var(--anim-delay,0s) both; opacity: 1; }
    @keyframes anim-fade-up { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }

    @media (prefers-reduced-motion: reduce) {
      .hero__label, .hero__title, .hero__desc { animation: none; opacity:1; transform:none; }
      .anim-up { opacity:1; }
      .anim-up.in { animation: none; }
    }

    @media (max-width: 480px) {
      .app-card { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav__brand" href="/">Kotote</a>
  <div class="nav__links">
    <a href="./minmo/">Minmo</a>
    <a href="./privacy-policy.html">プライバシーポリシー</a>
  </div>
</nav>

<section class="hero">
  <div class="hero__label">Kotote — コトテ</div>
  <h1 class="hero__title">離れて暮らす家族を、<br><em>技術で見守る。</em></h1>
  <p class="hero__desc">スマートフォンをもっと身近な安心に。<br>シンプルで使いやすいアプリをお届けします。</p>
</section>

<main class="apps">
  <p class="section-label">Apps</p>
  <h2 class="section-title">提供アプリ</h2>

  <a class="app-card" href="./minmo/">
    <div class="app-icon"><img src="./assets/minmo-icon.svg" alt="Minmo"></div>
    <div class="app-info">
      <h3>Minmo</h3>
      <p>古いスマートフォンを見守りカメラに。動体検知でLINEに通知します。</p>
      <div class="app-badges">
        <span class="badge badge--platform">Android</span>
        <span class="badge badge--status">開発中 · 2026年リリース予定</span>
      </div>
    </div>
  </a>

  <!-- 今後のアプリはここに追加 -->
  <div class="app-card app-card--soon">
    <div class="app-icon">＋</div>
    <div class="app-info">
      <h3>Next App</h3>
      <p>次のアプリを準備中です。</p>
    </div>
  </div>

</main>

<footer>
  <div class="footer__links">
    <a href="./privacy-policy.html">プライバシーポリシー</a>
    <a href="./terms.html">利用規約</a>
    <a href="./support.html">サポート</a>
    <a href="mailto:info@kotote.com">お問い合わせ</a>
  </div>
  <p class="footer__copy">&copy; 2026 Kotote（コトテ）. All rights reserved.</p>
</footer>

<script>
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, { threshold: 0.1 });

  // Section headers
  document.querySelectorAll('.section-label, .section-title').forEach((el, i) => {
    el.classList.add('anim-up');
    el.style.setProperty('--anim-delay', `${i * 0.08}s`);
    obs.observe(el);
  });

  // App cards — staggered
  document.querySelectorAll('.app-card').forEach((el, i) => {
    el.classList.add('anim-up');
    el.style.setProperty('--anim-delay', `${i * 0.12}s`);
    obs.observe(el);
  });
</script>
</body>
</html>
